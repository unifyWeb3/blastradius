<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="2px base; most console padding lands between 8 and 20" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.k{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.note{font-size:10.5px;color:var(--text-muted);line-height:1.45}
.spec{display:grid;grid-template-columns:1fr 150px;gap:14px;align-items:baseline}
.spec .m{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);line-height:1.5;text-align:right}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:4px 10px 4px 0;font-size:10.5px;color:var(--text-secondary);font-weight:400}
th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding-bottom:6px}
td.m{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body>
<div class="row" style="align-items:flex-end;gap:9px">
<div style="text-align:center"><div style="width:2px;height:2px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">2</div></div><div style="text-align:center"><div style="width:4px;height:4px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">4</div></div><div style="text-align:center"><div style="width:6px;height:6px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">6</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">8</div></div><div style="text-align:center"><div style="width:10px;height:10px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">10</div></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">12</div></div><div style="text-align:center"><div style="width:14px;height:14px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">14</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">16</div></div><div style="text-align:center"><div style="width:18px;height:18px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">18</div></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">20</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">24</div></div><div style="text-align:center"><div style="width:28px;height:28px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">28</div></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">32</div></div><div style="text-align:center"><div style="width:40px;height:40px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">40</div></div><div style="text-align:center"><div style="width:48px;height:48px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">48</div></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--teal-700);border-radius:2px;margin:0 auto"></div><div class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:5px">64</div></div>
</div>
<p class="note" style="margin:13px 0 0">Named rhythm: <span class="mono" style="font-size:10px">--gap-inline-tight 6</span> icon&rarr;label &nbsp;·&nbsp; <span class="mono" style="font-size:10px">--gap-inline 8</span> control clusters &nbsp;·&nbsp; <span class="mono" style="font-size:10px">--pad-panel 18</span> evidence panels &nbsp;·&nbsp; <span class="mono" style="font-size:10px">--pad-sidebar-section 20</span></p>
</body></html>
