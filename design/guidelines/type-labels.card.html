<!-- @dsCard group="Type" viewport="700x150" name="Labels & kickers" subtitle="10px / 700 / 0.09em uppercase — the console labels everything before it shows a value" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.k{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.note{font-size:10.5px;color:var(--text-muted);line-height:1.45}
.spec{display:grid;grid-template-columns:1fr 150px;gap:14px;align-items:baseline}
.spec .m{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);line-height:1.5;text-align:right}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:4px 10px 4px 0;font-size:10.5px;color:var(--text-secondary);font-weight:400}
th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding-bottom:6px}
td.m{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body>
<div class="row" style="gap:22px">
<span class="k">Exposed applications</span><span class="k">Topological candidates</span><span class="k">HydraDB query</span><span class="k">Traversal</span>
</div>
<div class="row" style="gap:22px;margin-top:12px">
<span class="k">UTC start</span><span class="k">Selected evidence path</span><span class="k">Half-open interval policy</span><span class="k" style="color:var(--status-compromised)">GHSA-PJWM-RVH2-C87W</span>
</div>
<p class="note" style="margin:13px 0 0">Kickers are muted by default. The single danger-toned kicker in the product is the advisory identifier.</p>
</body></html>
