<!-- @dsCard group="Graph" viewport="700x190" name="Canvas & edges" subtitle="Dot grid, neutral DEPENDS_ON edges, animated selected path, left-to-right direction" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.k{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.note{font-size:10.5px;color:var(--text-muted);line-height:1.45}
.ic{width:20px;height:20px;filter:invert(1);opacity:.62}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:4px 12px 4px 0;font-size:10.5px;color:var(--text-secondary);font-weight:400;vertical-align:top}
th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding-bottom:6px}
td.m{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body>
<div style="background:var(--graph-canvas);background-image:radial-gradient(var(--graph-grid) 1px,transparent 1px);background-size:18px 18px;border:1px solid var(--border-subtle);border-radius:var(--radius-none);padding:14px 16px">
<svg width="640" height="110" viewBox="0 0 640 110" style="display:block;max-width:100%">
  <defs>
    <marker id="a-n" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#45544F"/></marker>
    <marker id="a-s" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#E5484D"/></marker>
  </defs>
  <path d="M10,28 C120,28 160,28 250,28" stroke="#45544F" stroke-width="1.5" fill="none" marker-end="url(#a-n)"/>
  <rect x="96" y="18" width="74" height="15" rx="3" fill="#0E1413" opacity=".94"/>
  <text x="103" y="29" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="600" fill="#8C9C96">DEPENDS_ON</text>
  <path d="M10,82 C120,82 160,82 250,82" stroke="#E5484D" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#a-s)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.1s" repeatCount="indefinite"/></path>
  <rect x="96" y="72" width="74" height="15" rx="3" fill="#0E1413" opacity=".94"/>
  <text x="103" y="83" font-family="IBM Plex Mono,monospace" font-size="9" font-weight="600" fill="#EE6B67">DEPENDS_ON</text>
  <text x="268" y="32" font-family="IBM Plex Sans,sans-serif" font-size="10.5" fill="#A9B7B2">neutral edge &mdash; 1.5px, --graph-edge</text>
  <text x="268" y="86" font-family="IBM Plex Sans,sans-serif" font-size="10.5" fill="#A9B7B2">selected path &mdash; 2.5px, red-500, dashes flow toward the target</text>
</svg>
</div>
<p class="note" style="margin:11px 0 0">Direction is fixed at every viewport: consumer/application &rarr; dependency &rarr; compromised version. Edge labels sit on a canvas-coloured chip so they never fight the grid.</p>
</body></html>
