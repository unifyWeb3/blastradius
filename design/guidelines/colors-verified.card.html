<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.sw{display:flex;flex-direction:column;justify-content:flex-end;height:58px;padding:6px 7px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.06)}
.sw b{font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.sw i{font-family:var(--font-mono);font-size:8px;font-style:normal;opacity:.72;line-height:1.2;margin-top:2px}
.k{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.ramp{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.note{font-size:10.5px;color:var(--text-muted);line-height:1.45}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:4px 10px 4px 0;font-size:10.5px;color:var(--text-secondary);font-weight:400}
th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding-bottom:6px}
td.m{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body>
<div class="ramp" style="grid-template-columns:repeat(6,1fr)">
<div class="sw" style="background:var(--teal-300);color:#0D2E28"><b>300</b><i>#64D9BE</i></div><div class="sw" style="background:var(--teal-400);color:#0D2E28"><b>400</b><i>#46C9AA</i></div><div class="sw" style="background:var(--teal-500);color:#0D2E28"><b>500</b><i>#2FB89B</i></div><div class="sw" style="background:var(--teal-600);color:#fff"><b>600</b><i>#1E937C</i></div><div class="sw" style="background:var(--teal-700);color:#fff"><b>700</b><i>#167A69 src</i></div><div class="sw" style="background:var(--teal-900);color:#64D9BE"><b>900</b><i>#0D2E28</i></div>
</div>
<p class="note" style="margin:11px 0 0">One hue, one idea: <b style="color:var(--text-secondary)">this was measured</b>. Effective-exposure bars, evidence check glyphs, the graph selection ring, focus rings, and the HydraDB runtime badge.</p>
</body></html>
