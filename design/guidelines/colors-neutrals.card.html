<!-- @dsCard group="Colors" viewport="700x170" name="Neutral ramp" subtitle="Green-graphite neutrals inherited from the source #17201e / #edf0ee pair" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.sw{display:flex;flex-direction:column;justify-content:flex-end;height:58px;padding:6px 7px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.06)}
.sw b{font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.sw i{font-family:var(--font-mono);font-size:8px;font-style:normal;opacity:.72;line-height:1.2;margin-top:2px}
.k{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.ramp{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.note{font-size:10.5px;color:var(--text-muted);line-height:1.45}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:4px 10px 4px 0;font-size:10.5px;color:var(--text-secondary);font-weight:400}
th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding-bottom:6px}
td.m{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body>
<div class="ramp">
<div class="sw" style="background:var(--gr-1000);color:#8C9C96"><b>1000</b><i>#080C0B</i></div><div class="sw" style="background:var(--gr-950);color:#8C9C96"><b>950</b><i>#0B100F</i></div><div class="sw" style="background:var(--gr-925);color:#8C9C96"><b>925</b><i>#0E1413</i></div><div class="sw" style="background:var(--gr-900);color:#8C9C96"><b>900</b><i>#121917</i></div><div class="sw" style="background:var(--gr-850);color:#A9B7B2"><b>850</b><i>#17201E</i></div><div class="sw" style="background:var(--gr-800);color:#A9B7B2"><b>800</b><i>#1D2725</i></div><div class="sw" style="background:var(--gr-750);color:#A9B7B2"><b>750</b><i>#202A28</i></div><div class="sw" style="background:var(--gr-700);color:#CBD6D2"><b>700</b><i>#2C3936</i></div>
<div class="sw" style="background:var(--gr-600);color:#E6EDEA"><b>600</b><i>#3B4A46</i></div><div class="sw" style="background:var(--gr-500);color:#E6EDEA"><b>500</b><i>#55665F</i></div><div class="sw" style="background:var(--gr-400);color:#0B100F"><b>400</b><i>#6E807A</i></div><div class="sw" style="background:var(--gr-300);color:#0B100F"><b>300</b><i>#8C9C96</i></div><div class="sw" style="background:var(--gr-200);color:#0B100F"><b>200</b><i>#A9B7B2</i></div><div class="sw" style="background:var(--gr-100);color:#0B100F"><b>100</b><i>#CBD6D2</i></div><div class="sw" style="background:var(--gr-050);color:#0B100F"><b>050</b><i>#E6EDEA</i></div><div class="sw" style="background:var(--gr-000);color:#0B100F"><b>000</b><i>#F7FAF9</i></div>
</div>
</body></html>
