<!-- @dsCard group="Type" viewport="700x170" name="Titles & sections" subtitle="Page title, section title, subsection — three steps, no more" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.k{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.note{font-size:10.5px;color:var(--text-muted);line-height:1.45}
.spec{display:grid;grid-template-columns:1fr 150px;gap:14px;align-items:baseline}
.spec .m{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);line-height:1.5;text-align:right}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:4px 10px 4px 0;font-size:10.5px;color:var(--text-secondary);font-weight:400}
th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding-bottom:6px}
td.m{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body>
<div class="col" style="gap:11px">
<div class="spec"><div style="font-size:20px;font-weight:600;letter-spacing:-.014em;line-height:1.2">Transitive blast radius</div><div class="m">--type-title-*<br>20px / 600 / -0.014em</div></div>
<div class="spec"><div style="font-size:15px;font-weight:600;letter-spacing:-.008em;line-height:1.25">Exposure timeline</div><div class="m">--type-section-*<br>15px / 600 / -0.008em</div></div>
<div class="spec"><div style="font-size:13px;font-weight:600;letter-spacing:-.004em;line-height:1.3">Application check</div><div class="m">--type-subsection-*<br>13px / 600 / -0.004em</div></div>
</div>
</body></html>
