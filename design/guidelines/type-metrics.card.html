<!-- @dsCard group="Type" viewport="700x150" name="Metrics · tabular figures" subtitle="Numbers align across the summary band; an em dash means "not queried yet"" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.k{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.note{font-size:10.5px;color:var(--text-muted);line-height:1.45}
.spec{display:grid;grid-template-columns:1fr 150px;gap:14px;align-items:baseline}
.spec .m{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);line-height:1.5;text-align:right}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:4px 10px 4px 0;font-size:10.5px;color:var(--text-secondary);font-weight:400}
th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding-bottom:6px}
td.m{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body>
<div class="row" style="gap:0;align-items:stretch;border:1px solid var(--border-subtle);background:var(--surface-panel)">
<div style="flex:1;padding:14px 16px;border-right:1px solid var(--border-subtle)"><span class="k">Exposed</span><div style="margin-top:7px;font-size:24px;font-weight:600;letter-spacing:-.02em;font-feature-settings:'tnum' 1;color:var(--status-exposed)">1</div></div>
<div style="flex:1;padding:14px 16px;border-right:1px solid var(--border-subtle)"><span class="k">Candidates</span><div style="margin-top:7px;font-size:24px;font-weight:600;letter-spacing:-.02em;font-feature-settings:'tnum' 1">2</div></div>
<div style="flex:1;padding:14px 16px;border-right:1px solid var(--border-subtle)"><span class="k">HydraDB query</span><div style="margin-top:7px;font-size:24px;font-weight:600;letter-spacing:-.02em;font-feature-settings:'tnum' 1">50<span style="font-size:12px;font-weight:500;color:var(--text-muted);margin-left:4px">ms</span></div></div>
<div style="flex:1;padding:14px 16px"><span class="k">Traversal</span><div style="margin-top:7px;font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--text-faint)">&mdash;</div></div>
</div>
<p class="note" style="margin:11px 0 0">--type-metric-* &nbsp;24px / 600 / -0.02em / tabular. Units are 12px and muted so the digit stays the reading.</p>
</body></html>
