<!-- @dsCard group="Spacing" viewport="700x165" name="Elevation & rings" subtitle="Restrained: value and hairlines first, shadow only for things that float" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.k{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.note{font-size:10.5px;color:var(--text-muted);line-height:1.45}
.spec{display:grid;grid-template-columns:1fr 150px;gap:14px;align-items:baseline}
.spec .m{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);line-height:1.5;text-align:right}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:4px 10px 4px 0;font-size:10.5px;color:var(--text-secondary);font-weight:400}
th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding-bottom:6px}
td.m{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body>
<div class="row" style="gap:16px">
<div style="width:150px;padding:12px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--radius-md)"><div class="mono" style="font-size:9px;color:var(--text-secondary)">--shadow-none</div><div style="font-size:9px;color:var(--text-faint);margin-top:3px">panels, rows</div></div>
<div style="width:150px;padding:12px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-node)"><div class="mono" style="font-size:9px;color:var(--text-secondary)">--shadow-node</div><div style="font-size:9px;color:var(--text-faint);margin-top:3px">graph nodes</div></div>
<div style="width:150px;padding:12px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:var(--shadow-raised)"><div class="mono" style="font-size:9px;color:var(--text-secondary)">--shadow-raised</div><div style="font-size:9px;color:var(--text-faint);margin-top:3px">floating cards</div></div>
<div style="width:150px;padding:12px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--radius-md);box-shadow:0 0 0 1px var(--surface-panel),0 0 0 2px var(--graph-selection-ring)"><div class="mono" style="font-size:9px;color:var(--teal-300)">--ring-selected</div><div style="font-size:9px;color:var(--text-faint);margin-top:3px">selected path</div></div>
</div>
<p class="note" style="margin:12px 0 0">No coloured glows. The only ring is teal, and it always means &ldquo;this is the current selection&rdquo;.</p>
</body></html>
