<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & borders" subtitle="Five stacked surfaces, two hairline weights — depth comes from value, not shadow" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px 18px;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-sans)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.sw{display:flex;flex-direction:column;justify-content:flex-end;height:58px;padding:6px 7px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.06)}
.sw b{font-family:var(--font-mono);font-size:9px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.sw i{font-family:var(--font-mono);font-size:8px;font-style:normal;opacity:.72;line-height:1.2;margin-top:2px}
.k{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted)}
.mono{font-family:var(--font-mono)}
.ramp{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.note{font-size:10.5px;color:var(--text-muted);line-height:1.45}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:4px 10px 4px 0;font-size:10.5px;color:var(--text-secondary);font-weight:400}
th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding-bottom:6px}
td.m{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}</style></head><body>
<div class="row" style="gap:0;align-items:stretch;border:1px solid var(--border-default)">
<div style="flex:1;padding:12px;background:var(--bg-app)"><span class="k">app</span><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:4px">--bg-app</div></div>
<div style="flex:1;padding:12px;background:var(--surface-sunken);border-left:1px solid var(--border-subtle)"><span class="k">sunken</span><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:4px">--surface-sunken</div></div>
<div style="flex:1;padding:12px;background:var(--surface-panel);border-left:1px solid var(--border-subtle)"><span class="k">panel</span><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:4px">--surface-panel</div></div>
<div style="flex:1;padding:12px;background:var(--surface-raised);border-left:1px solid var(--border-subtle)"><span class="k">raised</span><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:4px">--surface-raised</div></div>
<div style="flex:1;padding:12px;background:var(--surface-hover);border-left:1px solid var(--border-subtle)"><span class="k">hover</span><div class="mono" style="font-size:9px;color:var(--text-faint);margin-top:4px">--surface-hover</div></div>
</div>
<div class="row" style="margin-top:12px;gap:18px">
<span class="row" style="gap:7px"><span style="width:44px;height:0;border-top:1px solid var(--border-subtle)"></span><span class="mono" style="font-size:9.5px;color:var(--text-muted)">--border-subtle</span></span>
<span class="row" style="gap:7px"><span style="width:44px;height:0;border-top:1px solid var(--border-default)"></span><span class="mono" style="font-size:9.5px;color:var(--text-muted)">--border-default</span></span>
<span class="row" style="gap:7px"><span style="width:44px;height:0;border-top:1px solid var(--border-strong)"></span><span class="mono" style="font-size:9.5px;color:var(--text-muted)">--border-strong</span></span>
</div>
</body></html>
